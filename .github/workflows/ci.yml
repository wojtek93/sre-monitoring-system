name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Verify app imports
        run: |
          python -c "from app.main import app; print('FastAPI app import OK')"

      - name: Check Python syntax
        run: |
          python -m compileall app

      - name: Build Docker image
        run: |
          docker build -t sre-demo:ci .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag sre-demo:ci ghcr.io/wojtek93/sre-monitoring-system:${{ github.sha }}
          docker push ghcr.io/wojtek93/sre-monitoring-system:${{ github.sha }}
